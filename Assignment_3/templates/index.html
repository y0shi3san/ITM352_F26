<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Quiz</title>
</head>
<body>
    <h1>Welcome to the Quiz</h1>
    <p>Choose a category. The quiz will select {{ question_count }} random questions.</p>
    <p>You have {{ time_limit }} seconds to answer each question.</p>
    <!-- Submit the chosen category to start a new randomized quiz. -->
    <form method="POST" action="{{ url_for('start_quiz') }}">
        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="" disabled selected>Select a category</option>
            {% for category_name in categories %}
                <option value="{{ category_name }}">{{ category_name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Start Quiz</button>
    </form>
</body>
</html>
